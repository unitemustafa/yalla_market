name: Mobile release checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android release
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY"

  ios-release:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without signing
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY"
