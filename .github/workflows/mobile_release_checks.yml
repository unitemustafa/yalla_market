name: Mobile release checks

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to check
        type: choice
        options: [all, android, ios]
        default: all
      sign_ios:
        description: Export a signed iOS IPA using App Store distribution credentials
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-release:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          names = (
              "ANDROID_KEYSTORE_BASE64", "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD", "ANDROID_STORE_PASSWORD",
          )
          for name in names:
              if not os.environ.get(name):
                  raise SystemExit(f"Required Android signing secret is missing: {name}")
          Path("android/app/yalla-release.jks").write_bytes(
              base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          )
          def property_value(value):
              return json.dumps(value, ensure_ascii=True)[1:-1].replace(" ", "\\ ")
          values = {
              "storeFile": "yalla-release.jks",
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "storePassword": os.environ["ANDROID_STORE_PASSWORD"],
          }
          Path("android/key.properties").write_text(
              "".join(f"{name}={property_value(value)}\n" for name, value in values.items()),
              encoding="ascii",
          )
          PY
      - name: Build Android release
        env:
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          SKIP_CRASHLYTICS_MAPPING_UPLOAD: ${{ vars.SKIP_CRASHLYTICS_MAPPING_UPLOAD || 'false' }}
        run: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY"
      - name: Save signed Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: yalla-market-android-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/yalla-release.jks

  ios-release:
    if: inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify the iOS SDK
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          if [[ "${sdk_version%%.*}" -lt 26 ]]; then
            echo '::error::An iOS SDK of 26 or later is required.'
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure iOS Firebase
        env:
          GOOGLE_SERVICE_INFO_PLIST_IOS_APP_COM_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_IOS_APP_COM_BASE64 }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import plistlib
          import re
          from pathlib import Path

          encoded = os.environ.get("GOOGLE_SERVICE_INFO_PLIST_IOS_APP_COM_BASE64")
          if not encoded:
              raise SystemExit("Required Firebase secret is missing: GOOGLE_SERVICE_INFO_PLIST_IOS_APP_COM_BASE64")
          data = base64.b64decode(encoded, validate=True)
          if plistlib.loads(data).get("BUNDLE_ID") != "com.yallamarket.app.com":
              raise SystemExit("Firebase iOS bundle identifier does not match this app")
          Path("ios/Runner/GoogleService-Info.plist").write_bytes(data)
          app_id = os.environ.get("FACEBOOK_APP_ID", "")
          client_token = os.environ.get("FACEBOOK_CLIENT_TOKEN", "")
          if not re.fullmatch(r"[1-9][0-9]+", app_id) or not re.fullmatch(r"[a-fA-F0-9]{32}", client_token):
              raise SystemExit("Valid FACEBOOK_APP_ID and FACEBOOK_CLIENT_TOKEN secrets are required")
          Path("ios/Flutter/Facebook.xcconfig").write_text(
              f"FACEBOOK_APP_ID = {app_id}\nFACEBOOK_CLIENT_TOKEN = {client_token}\n",
              encoding="ascii",
          )
          PY
      - name: Configure App Store signing
        if: inputs.sign_ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash tool/configure_ios_distribution.sh
      - name: Build iOS release
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://api.yallamarket.org' }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          SIGN_IOS: ${{ inputs.sign_ios }}
        run: |
          python3 tool/configure_shared_links.py
          build_args=(--release --dart-define=API_BASE_URL="$API_BASE_URL"
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY")
          if [[ "$SIGN_IOS" == true ]]; then
            if [[ -z "$MAPTILER_API_KEY" ]]; then
              echo '::error::MAPTILER_API_KEY is required for an App Store build.'
              exit 1
            fi
            flutter build ipa "${build_args[@]}" \
              --export-options-plist="$RUNNER_TEMP/yalla-ios-export.plist"
          else
            flutter build ios "${build_args[@]}" --no-codesign
          fi
      - name: Save signed iOS IPA
        if: inputs.sign_ios
        uses: actions/upload-artifact@v4
        with:
          name: yalla-market-ios-release
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Remove iOS build configuration
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/yalla-ios.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/yalla-ios.keychain-db"
          fi
          rm -f ios/Runner/GoogleService-Info.plist ios/Flutter/Facebook.xcconfig \
            ios/Flutter/DistributionSigning.xcconfig
